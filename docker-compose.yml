services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: taxlens
      POSTGRES_USER: taxlens
      POSTGRES_PASSWORD: taxlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxlens -d taxlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    container_name: taxlens-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: taxlens
      DATABASE_USER: taxlens
      DATABASE_PASSWORD: taxlens
      LOCAL_STORAGE_PATH: /workspace/data/local
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-local}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-raw-documents}
      AZURE_STORAGE_NORMALIZED_CONTAINER: ${AZURE_STORAGE_NORMALIZED_CONTAINER:-normalized-text}
      EMBEDDING_MODEL_PATH: /opt/taxlens-models/multilingual-e5-small
      AIRFLOW_INTERNAL_TOKEN: ${AIRFLOW_INTERNAL_TOKEN:-taxlens-local-internal-token}
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN:-taxlens-local-internal-token}
      AUTH_INITIAL_ADMIN_USERNAME: ${AUTH_INITIAL_ADMIN_USERNAME:-admin}
      AUTH_INITIAL_ADMIN_PASSWORD: ${AUTH_INITIAL_ADMIN_PASSWORD:-}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn taxlens.api.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      API_ORIGIN: http://api:8000
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN:-taxlens-local-internal-token}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-taxlens-local-nextauth-secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}

  airflow-postgres:
    image: postgres:16
    profiles: ["airflow"]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    profiles: ["airflow"]
    depends_on:
      airflow-postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-taxlens-local-secret}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: taxlens
      DATABASE_USER: taxlens
      DATABASE_PASSWORD: taxlens
      LOCAL_STORAGE_PATH: /workspace/data/local
      EMBEDDING_MODEL_PATH: /opt/taxlens-models/multilingual-e5-small
      TAXLENS_DAILY_SOURCE_LIMIT: ${TAXLENS_DAILY_SOURCE_LIMIT:-100}
      TAXLENS_DISCOVERY_PAGES: ${TAXLENS_DISCOVERY_PAGES:-10}
      TAXLENS_PROCESS_BATCH_SIZE: ${TAXLENS_PROCESS_BATCH_SIZE:-1}
      TAXLENS_PROCESS_MAX_BATCHES: ${TAXLENS_PROCESS_MAX_BATCHES:-20}
      TAXLENS_API_URL: http://api:8000
      TAXLENS_AIRFLOW_INTERNAL_TOKEN: ${AIRFLOW_INTERNAL_TOKEN:-taxlens-local-internal-token}
    volumes:
      - .:/workspace
      - airflow_dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: bash -c "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USERNAME:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname TaxLens --lastname Admin --role Admin --email admin@taxlens.local || true"

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes:
      - .:/workspace
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: airflow scheduler

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: airflow webserver

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    profiles: ["llmops"]
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >-
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts

volumes:
  postgres_data:
  airflow_postgres_data:
  airflow_dags:
  airflow_logs:
  mlflow_data:
