services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: taxlens
      POSTGRES_USER: taxlens
      POSTGRES_PASSWORD: taxlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxlens -d taxlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: taxlens
      DATABASE_USER: taxlens
      DATABASE_PASSWORD: taxlens
      LOCAL_STORAGE_PATH: /workspace/data/local
      EMBEDDING_MODEL_PATH: /opt/taxlens-models/multilingual-e5-small
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn taxlens.api.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
