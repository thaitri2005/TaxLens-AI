name: Publish release images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag; defaults to the commit SHA
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish Azure images
    runs-on: ubuntu-latest
    environment: azure-release
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ACR_LOGIN_SERVER: taxlensdevacr.azurecr.io
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to Azure Container Registry
        run: az acr login --name taxlensdevacr
      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile -t "$ACR_LOGIN_SERVER/taxlens-api:$IMAGE_TAG" .
          docker push "$ACR_LOGIN_SERVER/taxlens-api:$IMAGE_TAG"
      - name: Build and push web image
        run: |
          docker build -f apps/web/Dockerfile --build-arg API_ORIGIN=http://taxlens-dev-api -t "$ACR_LOGIN_SERVER/taxlens-web:$IMAGE_TAG" .
          docker push "$ACR_LOGIN_SERVER/taxlens-web:$IMAGE_TAG"
      - name: Build and push Airflow image
        run: |
          docker build -f airflow/Dockerfile -t "$ACR_LOGIN_SERVER/taxlens-airflow:$IMAGE_TAG" .
          docker push "$ACR_LOGIN_SERVER/taxlens-airflow:$IMAGE_TAG"
      - name: Publish image references
        run: |
          echo "API_IMAGE=$ACR_LOGIN_SERVER/taxlens-api:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "WEB_IMAGE=$ACR_LOGIN_SERVER/taxlens-web:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "AIRFLOW_IMAGE=$ACR_LOGIN_SERVER/taxlens-airflow:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
