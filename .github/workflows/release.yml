name: Release and deploy

# One run from main to Azure: build and push the images, plan the Terraform update with
# them, and apply it. To roll back, untick build and give an existing image tag; to only
# preview, untick apply.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag; defaults to the commit SHA. Required when build is unticked.
        required: false
        type: string
      build:
        description: Build and push new images (untick to redeploy an existing tag)
        required: true
        default: true
        type: boolean
      apply:
        description: Apply the plan (untick to only preview it)
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
  ACR_LOGIN_SERVER: taxlensdevacr.azurecr.io
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  build:
    name: Build and push images
    if: ${{ inputs.build }}
    runs-on: ubuntu-latest
    environment: azure-release
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to Azure Container Registry
        run: az acr login --name taxlensdevacr
      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile --build-arg TAXLENS_CODE_VERSION="$GITHUB_SHA" -t "$ACR_LOGIN_SERVER/taxlens-api:$IMAGE_TAG" .
          docker push "$ACR_LOGIN_SERVER/taxlens-api:$IMAGE_TAG"
      - name: Build and push web image
        run: |
          docker build -f apps/web/Dockerfile --build-arg API_ORIGIN=http://taxlens-dev-api -t "$ACR_LOGIN_SERVER/taxlens-web:$IMAGE_TAG" .
          docker push "$ACR_LOGIN_SERVER/taxlens-web:$IMAGE_TAG"
      - name: Build and push Airflow image
        run: |
          docker build -f airflow/Dockerfile -t "$ACR_LOGIN_SERVER/taxlens-airflow:$IMAGE_TAG" .
          docker push "$ACR_LOGIN_SERVER/taxlens-airflow:$IMAGE_TAG"
      - name: Summarize images
        run: |
          {
            echo "API_IMAGE=$ACR_LOGIN_SERVER/taxlens-api:$IMAGE_TAG"
            echo "WEB_IMAGE=$ACR_LOGIN_SERVER/taxlens-web:$IMAGE_TAG"
            echo "AIRFLOW_IMAGE=$ACR_LOGIN_SERVER/taxlens-airflow:$IMAGE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: Terraform plan
    needs: build
    # Runs after a successful build, or straight away when build is unticked.
    if: ${{ !cancelled() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.image_tag != '')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - name: Write temporary Terraform variables
        working-directory: infra/terraform
        run: |
          cat > ci.auto.tfvars <<EOF
          subscription_id = "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          postgres_allowed_ip = "${{ secrets.TF_VAR_POSTGRES_ALLOWED_IP }}"
          airflow_enabled = true
          airflow_web_external_enabled = true
          api_image = "$ACR_LOGIN_SERVER/taxlens-api:$IMAGE_TAG"
          web_image = "$ACR_LOGIN_SERVER/taxlens-web:$IMAGE_TAG"
          airflow_image = "$ACR_LOGIN_SERVER/taxlens-airflow:$IMAGE_TAG"
          EOF
          terraform fmt ci.auto.tfvars
      - name: Initialize remote backend
        working-directory: infra/terraform
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init
      - name: Validate and plan
        working-directory: infra/terraform
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_postgres_admin_password: ${{ secrets.TF_VAR_POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_hf_token: ${{ secrets.TF_VAR_HF_TOKEN }}
          TF_VAR_auth_internal_token: ${{ secrets.TF_VAR_AUTH_INTERNAL_TOKEN }}
          TF_VAR_nextauth_secret: ${{ secrets.TF_VAR_NEXTAUTH_SECRET }}
          TF_VAR_airflow_admin_password: ${{ secrets.TF_VAR_AIRFLOW_ADMIN_PASSWORD }}
          TF_VAR_airflow_internal_token: ${{ secrets.TF_VAR_AIRFLOW_INTERNAL_TOKEN }}
        run: |
          terraform fmt -check -recursive
          terraform validate
          terraform plan -out=tfplan
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: infra/terraform/tfplan
          retention-days: 1

  apply:
    name: Apply Terraform plan
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.apply }}
    runs-on: ubuntu-latest
    environment: azure-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - name: Initialize remote backend
        working-directory: infra/terraform
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform init
      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: infra/terraform
      - name: Apply plan
        working-directory: infra/terraform
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform apply -auto-approve tfplan
