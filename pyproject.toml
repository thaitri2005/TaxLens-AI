[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taxlens-ai"
version = "0.1.0"
description = "Vietnamese tax regulatory intelligence platform"
readme = "docs/local-development.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "pgvector>=0.3,<1.0",
  "pypdf>=5.0,<6.0",
  "pypdfium2>=4.30,<5.0",
  "pytesseract>=0.3.13,<1.0",
  "sentence-transformers>=3.3,<4.0",
  "uvicorn[standard]>=0.32,<1.0",
  "langchain-core>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]
llmops = [
  "mlflow>=3.0,<4.0",
  "ragas>=0.2,<1.0",
]
cloud = [
  "azure-identity>=1.19,<2.0",
  "azure-storage-blob>=12.24,<13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taxlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/taxlens/api/routes/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
